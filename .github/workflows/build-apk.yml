jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Verify index.html
      run: |
        if [ ! -f "index.html" ]; then
          echo "Error: index.html not found!"
          exit 1
        fi

    - name: Setup Capacitor and Android Project
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "PrayerTimes" "com.prayer.app" --web-dir .
        npx cap add android
        npx cap sync android

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PrayerTimes-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Android configuration files
      run: flutter create . --platforms=android --org=com.salat.app

    - name: Add Permissions to AndroidManifest
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        PERMISSIONS='<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
        sed -i "/<manifest/a \    $PERMISSIONS" $MANIFEST_PATH

    - name: Get Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk

