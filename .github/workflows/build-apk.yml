jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Verify index.html exists
      run: |
        if [ ! -f "index.html" ]; then
          echo "Error: index.html not found in root directory!"
          exit 1
        fi

    - name: Build Web Application & Capacitor Android
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "PrayerTimes" "com.prayer.app" --web-dir .
        npx cap add android
        npx cap sync android

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PrayerTimes-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Verify and Prepare Web Assets
        run: |
          set -e

          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          rm -rf www
          mkdir -p www
          cp index.html www/

          echo "Web assets prepared successfully."

      - name: Install Capacitor
        run: |
          set -e

          npm init -y

          npm install \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6

      - name: Configure Capacitor
        run: |
          set -e

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.prayer.app",
            "appName": "PrayerTimes",
            "webDir": "www"
          }
          EOF

      - name: Add Android Platform
        run: |
          set -e

          npx cap add android
          npx cap sync android

      - name: Clean Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean --no-daemon

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrayerTimes-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          name: Build Android APK

