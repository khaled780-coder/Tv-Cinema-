name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova and Build Android App
        run: |
          npm install -g cordova
          cordova create build_app com.tv.app "القنوات الفضائية"
          rm -rf build_app/www/*
          cp index.html manifest.json sw.js build_app/www/ 2>/dev/null || cp index.html build_app/www/
          
          if [ -f "icon.png" ]; then
            cp icon.png build_app/www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' build_app/config.xml
          fi

          cd build_app
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Channels-App-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
